	<script>
		(function () {
			var geistMono = '"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';
			var fontDescriptor = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'font');

			if (!fontDescriptor || !fontDescriptor.get || !fontDescriptor.set) return;

			Object.defineProperty(CanvasRenderingContext2D.prototype, 'font', {
				get:function () {
					return fontDescriptor.get.call(this);
				},
				set:function (value) {
					if (typeof value === 'string' && value.indexOf('29px Helvetica') !== -1) {
						value = '28px ' + geistMono;
					}
					return fontDescriptor.set.call(this, value);
				}
			});
		})();
	</script>
