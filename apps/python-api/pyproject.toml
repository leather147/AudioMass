[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "audiomass-python-api"
version = "1.0.0"
description = "Heavy audio analysis and DSP service for AudioMass"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "faster-whisper==1.2.1",
  "httpx2==2.7.0",
  "imageio-ffmpeg==0.6.0",
  "lazy-loader==0.5",
  "librosa==0.11.0",
  "numba==0.66.0",
  "numpy==2.4.6",
  "pydantic==2.13.4",
  "pyloudnorm==0.2.0",
  "python-multipart==0.0.32",
  "scipy==1.18.0",
  "soundfile==0.14.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PIE", "PT", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "imageio_ffmpeg.*",
  "lazy_loader.*",
  "librosa.*",
  "pyloudnorm.*",
  "scipy.*",
  "soundfile.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
